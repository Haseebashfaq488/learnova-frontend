<div class="flex flex-col items-center mb-space-lg">
<div class="w-14 h-14 rounded-lg bg-surface-container-lowest shadow-sm flex items-center justify-center p-2 mb-3">
<img alt="Learnova Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WjcEs7hjlueylY6VycQ4AVV5agJsnC3Q2hhAu1ZpAK5FZEjA08xzZxjEnsWFOp-EmsdIKKjlKGMjSvhgfV_exzPbhpCyZ6GNzOYtn1XoZ9X_nT5CubUqk5pMlyoB943Sz6qLbj2zqVdvXHxVPLKj3tHoS4dVnDNXTUpai9ZNJ_ClWcfW1WxebDgD4PZpGI2Ls0vZaIKOL1pnuyoTZfW98KtMHOkko2EjgzTTf2szeOujvADsf7KHxKo1s"/>
</div>
<span class="font-headline-sm text-headline-sm text-primary tracking-tight font-semibold">Learnova</span>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest mt-1">Academic Workspace</span>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-8 sm:p-10 flex flex-col">
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-primary font-semibold tracking-tight">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5">Sign in to your learning workspace</p>
</div>
<div class="bg-surface-container-low p-1 rounded-lg flex items-center mb-7 relative" id="role-selector">
<button class="flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm" id="role-student" onclick="setRole('student')" type="button">
        Student
      </button>
<button class="flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 text-on-surface-variant hover:text-primary" id="role-teacher" onclick="setRole('teacher')" type="button">
        Teacher
      </button>
</div>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md font-medium text-primary flex items-center justify-between" for="email">
<span>Institutional Email</span>
<span class="font-label-sm text-label-sm text-outline font-normal" id="role-hint">Student Portal</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">mail</span>
<input class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline/60 focus:bg-surface-container-lowest outline-none shadow-sm focus:shadow-md transition-shadow" id="email" name="email" placeholder="name@school.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md font-medium text-primary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">lock</span>
<input class="w-full h-11 pl-10 pr-12 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline/60 outline-none shadow-sm focus:shadow-md transition-shadow" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-2.5 px-1.5 py-1 rounded text-outline hover:text-primary transition-colors flex items-center justify-center" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-lg" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 mt-1">
<input class="w-4 h-4 rounded-sm accent-secondary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Keep me signed in on this device</label>
</div>
<button class="w-full h-11 mt-2 rounded-lg bg-secondary text-on-secondary font-label-md text-label-md font-semibold tracking-wide shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 flex flex-col items-center gap-3">
<div class="w-full h-px bg-surface-container-high"></div>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">
        Don't have an account? 
        <a class="font-label-md text-label-md font-semibold text-secondary hover:underline ml-1" href="#">Create Account</a>
</p>
</div>
</div>
<div class="flex items-center gap-6 mt-8 font-label-sm text-label-sm text-outline">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="inline-block w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="inline-block w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Support Desk</a>
</div>
</div>
<script>
  function setRole(role) {
    const studentBtn = document.getElementById('role-student');
    const teacherBtn = document.getElementById('role-teacher');
    const roleHint = document.getElementById('role-hint');
    const emailInput = document.getElementById('email');

    if (role === 'student') {
      studentBtn.className = 'flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
      teacherBtn.className = 'flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 text-on-surface-variant hover:text-primary';
      roleHint.textContent = 'Student Portal';
      emailInput.placeholder = 'name@school.edu';
    } else {
      teacherBtn.className = 'flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
      studentBtn.className = 'flex-1 py-1.5 px-3 rounded-lg font-label-md text-label-md font-medium text-center transition-all duration-200 text-on-surface-variant hover:text-primary';
      roleHint.textContent = 'Faculty Workspace';
      emailInput.placeholder = 'faculty@institution.edu';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('toggle-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
